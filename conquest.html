<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Terrain Conquest · Persistent Island Siege</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>" />
    <link rel="stylesheet" href="./css/examples.css?ver=1.0.0" />
    <link rel="stylesheet" href="./p1/style.css" />
    <link rel="stylesheet" href="./p1/css/conquest.css" />
  </head>

  <body class="conquest-mode" data-mode="conquest">
    <div id="conquest-banner" hidden></div>

    <aside id="conquest-hud">
      <div class="cq-row">
        <button type="button" class="cq-team-btn active" data-team="red" id="cq-team-red">RED</button>
        <button type="button" class="cq-team-btn" data-team="blue" id="cq-team-blue">BLUE</button>
        <span class="cq-spacer"></span>
        <span id="cq-sector-summary"></span>
      </div>
      <div class="cq-bar">
        <div class="cq-bar-red" id="cq-bar-red"></div>
        <div class="cq-bar-neutral" id="cq-bar-neutral"></div>
        <div class="cq-bar-blue" id="cq-bar-blue"></div>
      </div>

      <div class="cq-row">
        <span>HP</span>
        <div class="cq-bar cq-hp"><div id="cq-truck-hp-fill"></div></div>
      </div>

      <div id="cq-objective-status"></div>
      <div class="cq-bar" id="cq-capture-bar" hidden><div id="cq-capture-fill"></div></div>

      <div class="cq-row">
        <span id="cq-trailer-badge"></span>
        <span class="cq-spacer"></span>
        <button type="button" class="cq-btn" id="cq-spawn-artillery-btn">+ Artillery</button>
        <button type="button" class="cq-btn" id="cq-spawn-sentry-btn">+ Sentry</button>
      </div>

      <div class="cq-row cq-muted">
        <span id="cq-net-status"></span>
        <span id="cq-peer-count"></span>
        <span class="cq-spacer"></span>
        <button type="button" class="cq-btn" id="cq-copy-invite-btn">Invite</button>
        <button type="button" class="cq-btn" id="cq-reset-island-btn">Reset</button>
      </div>
    </aside>

    <div id="cq-controls-hint">
      WASD drive · Space brake · Click/F fire · T deploy · R respawn · C cam · Tab map
    </div>

    <div id="minimap-container"></div>
    <div id="reticle">
      <img src="./assets/img/reticle.png" alt="Crosshair" />
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script type="importmap">
      {
        "imports": {
          "enable3d": "./lib/enable3d/enable3d.framework.0.26.0_dev0.module.min.js",
          "three": "https://unpkg.com/three@0.177.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.177.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import { THREE } from 'enable3d'
      window.THREE = THREE
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script type="module" src="./p1/js/conquestMain.js"></script>
    <script type="module" src="./p1/js/rangeLauncher.js"></script>
  </body>
</html>
